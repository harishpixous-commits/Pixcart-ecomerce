# Local full stack: docker compose up --build, then open http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pixcart
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  migrate:
    build: ./backend
    # Demo data and a demo admin: never use these in production.
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed --demo && python -m scripts.create_admin --email admin@pixcart.in --name 'PixCart Admin'"]
    environment: &api_env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pixcart
      MEDIA_ROOT: /app/var/media
      PRIVATE_ROOT: /app/var/private
      ADMIN_PASSWORD: PixCart@Admin2026
    volumes: [media:/app/var]
    depends_on:
      db: { condition: service_healthy }
  api:
    build: ./backend
    environment:
      <<: *api_env
      CORS_ORIGINS: http://localhost:3000
    volumes: [media:/app/var]
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    build:
      context: ./frontend
      args: { API_ORIGIN: "http://api:8000" }
    environment:
      API_ORIGIN: http://api:8000
      PUBLIC_WEB_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  media:
