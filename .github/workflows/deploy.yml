# Builds both images, runs database migrations, then rolls out the API and the web services.
# Needs (GitHub → Settings → Environments → production → variables):
#   AWS_DEPLOY_ROLE_ARN  output deploy_role_arn from Terraform
#   AWS_REGION           ap-south-1
#   ECS_CLUSTER          output ecs_cluster
#   PRIVATE_SUBNETS      output private_subnets (comma separated)
#   APP_SECURITY_GROUP   output app_security_group
name: Deploy
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER: ${{ vars.ECS_CLUSTER }}
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env: { REGISTRY: "${{ steps.ecr.outputs.registry }}" }
        run: |
          # Tags are immutable: a re-run for the same commit reuses the images already pushed.
          if ! aws ecr describe-images --repository-name pixcart/api --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            docker buildx build --push --provenance=false -t "$REGISTRY/pixcart/api:$TAG" backend
          fi
          if ! aws ecr describe-images --repository-name pixcart/web --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            docker buildx build --push --provenance=false --build-arg API_ORIGIN=http://api:8000 -t "$REGISTRY/pixcart/web:$TAG" frontend
          fi

      - name: Register task definitions with the new images
        env: { REGISTRY: "${{ steps.ecr.outputs.registry }}" }
        run: |
          set -euo pipefail
          for svc in api web migrate; do
            family="${CLUSTER}-${svc}"
            image="$REGISTRY/pixcart/$([ "$svc" = web ] && echo web || echo api):$TAG"
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition > td.json
            jq --arg img "$image" '.containerDefinitions[0].image = $img
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' td.json > td-new.json
            arn=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query taskDefinition.taskDefinitionArn --output text)
            echo "${svc^^}_TD=$arn" >> "$GITHUB_ENV"
          done

      - name: Run database migrations
        run: |
          set -euo pipefail
          task=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$MIGRATE_TD" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNETS }}],securityGroups=[${{ vars.APP_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $code"
          test "$code" = "0"

      - name: Roll out the API, then the web
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service api --task-definition "$API_TD" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services api
          aws ecs update-service --cluster "$CLUSTER" --service web --task-definition "$WEB_TD" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services web

      - name: Smoke test
        run: |
          domain=$(aws ecs describe-task-definition --task-definition "$WEB_TD" --query "taskDefinition.containerDefinitions[0].environment[?name=='PUBLIC_WEB_URL'].value" --output text)
          curl -sf "$domain/api/health"
          curl -sf "$domain/" > /dev/null
