name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pip-audit
      - run: ruff check app scripts tests --select E,F,W,I,B,UP --ignore E501,B008,UP007
      - run: python -m pytest -q
      - name: Schema matches models
        run: |
          python - <<'PY'
          import psycopg2
          c = psycopg2.connect("postgresql://postgres:postgres@localhost:5432/postgres"); c.autocommit = True
          c.cursor().execute("CREATE DATABASE drift")
          PY
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/drift alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/drift alembic check
      - name: Known vulnerabilities in Python packages
        run: pip-audit -r requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pixcart }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pixcart
      SMS_PROVIDER: console
      ADMIN_PASSWORD: PixCart@Admin2026
      API_LOG: ${{ github.workspace }}/api.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - name: API with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m scripts.seed --demo
          python -m scripts.create_admin --email admin@pixcart.in --name "PixCart Admin"
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$API_LOG" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Web
        working-directory: frontend
        env: { API_ORIGIN: "http://127.0.0.1:8000" }
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/robots.txt > /dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            web.log

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load -t pixcart-api:ci backend
      - run: docker buildx build --load --build-arg API_ORIGIN=http://api:8000 -t pixcart-web:ci frontend
      - name: API image imports cleanly as the non-root user
        run: docker run --rm pixcart-api:ci python -c "import app.main; print('ok')"

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
