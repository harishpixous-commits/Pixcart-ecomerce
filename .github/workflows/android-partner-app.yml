# Builds the delivery partner Android app (mobile/partner-app) and publishes the APK as a GitHub release.
# Run it from Actions → Android partner app → Run workflow, then upload the APK in
# Admin → Delivery → Settings → Partner Android app (or paste the release link there).
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON       base64 of google-services.json from Firebase (Android app "in.pixcart.partner"): push notifications
#   ANDROID_KEYSTORE_BASE64    base64 of your release keystore (.jks); without it the APK is debug-signed (for testing only)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# Keep the same keystore for every release: Android only installs updates signed with the same key.
name: Android partner app
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Your live website, e.g. https://pixcart.in (the app opens <site>/delivery)"
        required: true
      version:
        description: "Version shown to partners, e.g. 1.0.0"
        required: true
        default: "1.0.0"
      app_id:
        description: "Android application id (change only before the first release)"
        required: false
        default: "in.pixcart.partner"

permissions:
  contents: write

concurrency:
  group: android-partner-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: mobile/partner-app } }
    env:
      PIXCART_WEB_URL: ${{ inputs.web_url }}
      PIXCART_APP_ID: ${{ inputs.app_id }}
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD: ${{ github.run_number }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mobile/partner-app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Check the inputs
        run: |
          case "$PIXCART_WEB_URL" in https://*) ;; *) echo "::error::web_url must start with https://"; exit 1;; esac
          echo "$APP_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "::error::version must look like 1.0.0"; exit 1; }

      - run: npm ci
      - name: Create the Android project
        run: |
          npx cap add android
          npx --yes @capacitor/assets@4.0.0 generate --android --iconBackgroundColor '#0B5563' --splashBackgroundColor '#EEF2F4' --splashBackgroundColorDark '#073B45'
          npx cap sync android
          node scripts/patch-android.mjs
      - name: Firebase (push notifications)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "Push notifications: on"
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set: the app works, but without push notifications."
          fi

      - name: Build (signed release)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          npx cap build android --androidreleasetype APK --signing-type apksigner \
            --keystorepath "$RUNNER_TEMP/release.jks" --keystorepass "$KEYSTORE_PASSWORD" \
            --keystorealias "$KEY_ALIAS" --keystorealiaspass "$KEY_PASSWORD"
          cp android/app/build/outputs/apk/release/app-release-signed.apk "$RUNNER_TEMP/pixcart-partner.apk"
      - name: Build (debug-signed, for testing)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::No release keystore secrets: building a debug-signed APK. Add the keystore secrets before giving the app to partners."
          cd android && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pixcart-partner.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pixcart-partner-${{ inputs.version }}
          path: ${{ runner.temp }}/pixcart-partner.apk
          if-no-files-found: error

      - name: Publish as a GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="partner-app-v${APP_VERSION}-${APP_BUILD}"
          gh release create "$tag" "$RUNNER_TEMP/pixcart-partner.apk" \
            --title "Partner app ${APP_VERSION} (build ${APP_BUILD})" \
            --notes "Delivery partner Android app for ${PIXCART_WEB_URL}/delivery. Upload pixcart-partner.apk in Admin → Delivery → Settings → Partner Android app."
          echo "Download link: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/pixcart-partner.apk" >> "$GITHUB_STEP_SUMMARY"
